<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Atomic Scramble - Atomic Woodcraft</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&amp;family=Space+Grotesk:wght@700&amp;family=Work+Sans:wght@400;500&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "wood-teak-light": "#8d6e63",
                        "wood-mahogany-dark": "#5d4037",
                        "walnut-inlay": "#3e2723",
                        "atomic-teal": "#4dd0e1",
                        "sun-gold": "#fbc02d",
                        "cream-wallpaper": "#f5f5f0",
                        "on-surface": "#dee3e4",
                        "surface": "#1b2122",
                        "background": "#0f1415"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "slot-size": "48px",
                        "margin-md": "16px",
                        "margin-sm": "8px",
                        "board-padding": "24px",
                        "grid-gap": "4px",
                        "margin-lg": "32px"
                    },
                    "fontFamily": {
                        "display": ["Montserrat"],
                        "score-readout": ["Space Grotesk"],
                        "body-md": ["Work Sans"],
                        "tile-letter": ["Montserrat"]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #f5f5f0;
            background-image:
                radial-gradient(circle, rgba(77, 208, 225, 0.12) 1.5px, transparent 1.5px),
                radial-gradient(circle, rgba(251, 192, 45, 0.12) 1.5px, transparent 1.5px);
            background-size: 32px 32px;
            background-position: 0 0, 16px 16px;
        }

        h1 {
            font-family: theme('fontFamily.display');
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #3e2723;
            text-shadow: 2px 2px 0px #4dd0e1, 4px 4px 0px #3e2723;
        }

        /* The Board: mahogany-teak radial gradient with a routed walnut
           inset, giving the "physically weighted" carved-block look the
           spec calls for rather than a flat panel. */
        .atomic-board {
            background: radial-gradient(circle, #8d6e63 0%, #5d4037 100%);
            box-shadow:
                0 20px 40px rgba(0,0,0,0.35),
                inset 0 2px 0 rgba(255,255,255,0.15),
                inset 0 -6px 12px rgba(0,0,0,0.3);
            position: relative;
        }

        .atomic-board::before {
            content: '';
            position: absolute;
            inset: 10px;
            border-radius: inherit;
            background: #3e2723;
            box-shadow: inset 3px 3px 6px rgba(0,0,0,0.6), inset -2px -2px 4px rgba(255,255,255,0.05);
            z-index: 0;
        }

        .routed-slot {
            background-color: #3e2723;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.7), inset -1px -1px 2px rgba(255,255,255,0.05);
            position: relative;
            z-index: 1;
        }

        /* Atomic scoring badge: gold disc with intersecting orbit rings,
           the retro-futuristic detail the design spec singles out. */
        .orbit-badge {
            width: 96px;
            height: 96px;
            border-radius: 9999px;
            background: radial-gradient(circle at 35% 30%, #fdd85d, #fbc02d 70%);
            box-shadow: 0 6px 0 #c99a1f, 0 10px 16px rgba(0,0,0,0.3);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .orbit-badge::before, .orbit-badge::after {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: 9999px;
            border: 2px solid rgba(77, 208, 225, 0.6);
        }
        .orbit-badge::before { transform: rotate(20deg) scaleY(0.4); }
        .orbit-badge::after { transform: rotate(-20deg) scaleY(0.4); }

        /* Tactile Tiles: raised wood blocks with a top-edge highlight to
           simulate height, per the "Depth Physics" section of the spec. */
        .wood-tile {
            background: linear-gradient(145deg, #a1887f 0%, #6d4c41 100%);
            border-radius: theme('borderRadius.DEFAULT');
            box-shadow:
                0 6px 10px rgba(0,0,0,0.4),
                inset 0 2px 0px rgba(255,255,255,0.3),
                inset 0 -3px 0px rgba(0,0,0,0.25);
            color: #f5f5f0;
            font-family: theme('fontFamily.tile-letter');
            font-weight: 700;
            transition: transform 0.15s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .wood-tile:hover {
            transform: translateY(-3px);
        }

        .action-button {
            font-family: theme('fontFamily.display');
            letter-spacing: 0.05em;
            text-transform: uppercase;
            transition: transform 0.1s ease;
        }
        .action-button:active {
            transform: translateY(4px);
        }
        .btn-gold {
            background: #fbc02d;
            color: #402d00;
            box-shadow: 0 5px 0 #c99a1f;
        }
        .btn-gold:active { box-shadow: 0 1px 0 #c99a1f; }
        .btn-teal {
            background: #4dd0e1;
            color: #00363c;
            box-shadow: 0 5px 0 #35a3b3;
        }
        .btn-teal:active { box-shadow: 0 1px 0 #35a3b3; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col items-center justify-center">
<main class="flex-grow flex flex-col items-center justify-center gap-6 p-4">
<div class="orbit-badge">
<div class="text-center leading-tight z-10">
<div class="text-[10px] font-bold tracking-widest text-[#402d00]">SCORE</div>
<div class="font-score-readout text-xl font-bold text-[#402d00]">000</div>
</div>
</div>
<!-- The Game Board (Atomic Woodcraft, routed walnut inset + orbit-badge scoring) -->
<div class="atomic-board p-board-padding rounded-xl">
<div class="grid grid-cols-10 gap-grid-gap w-[320px] h-[320px] md:w-[480px] md:h-[480px] relative z-10">
<!-- Generate 100 slots for visual grid -->
<script>
                for(let i=0; i<100; i++) {
                    document.write('<div class="routed-slot w-full h-full rounded"></div>');
                }
            </script>
</div>
</div>
</main>
</body></html>
