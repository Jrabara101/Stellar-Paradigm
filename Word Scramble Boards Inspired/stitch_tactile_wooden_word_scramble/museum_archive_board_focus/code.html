<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Atomic Scramble - Museum Archive Edition</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "archive-charcoal": "#1a1a1a",
                        "archive-bone": "#e3dac9",
                        "archive-bone-dim": "#b3aa99",
                        "archive-slate": "#2c2c2c"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "slot-size": "48px",
                        "margin-md": "16px",
                        "margin-sm": "8px",
                        "board-padding": "24px",
                        "grid-gap": "4px",
                        "margin-lg": "32px"
                    },
                    "fontFamily": {
                        "mono": ["Space Mono", "monospace"]
                    },
                    "backgroundImage": {
                        'slate-texture': "url('https://images.unsplash.com/photo-1542880941-186981882d2f?q=80&w=2069&auto=format&fit=crop')",
                        'bone-texture': "url('https://images.unsplash.com/photo-1616428751433-5c8e3cb98e4d?q=80&w=1964&auto=format&fit=crop')"
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-image: var(--tw-gradient-stops);
            background-color: #1a1a1a;
            background: radial-gradient(circle at 65% 50%, rgba(60,60,60,0.8) 0%, rgba(26,26,26,1) 70%), url('https://images.unsplash.com/photo-1542880941-186981882d2f?q=80&w=2069&auto=format&fit=crop');
            background-size: cover;
            background-attachment: fixed;
            background-blend-mode: multiply;
        }

        .archive-board {
            background: #1a1a1a;
            box-shadow: inset 0 0 0 2px #b3aa99, 0 20px 40px rgba(0,0,0,0.8);
            position: relative;
        }

        /* Specimen-case corner tick marks — the calibration crosshairs
           printed on a museum display case, not a wood/metal frame detail. */
        .specimen-tick {
            position: absolute;
            width: 16px;
            height: 16px;
            pointer-events: none;
        }
        .specimen-tick::before, .specimen-tick::after {
            content: '';
            position: absolute;
            background: #b3aa99;
        }
        .specimen-tick::before { width: 100%; height: 1px; top: 50%; left: 0; }
        .specimen-tick::after { width: 1px; height: 100%; left: 50%; top: 0; }
        .specimen-tick.tl { top: -8px; left: -8px; }
        .specimen-tick.tr { top: -8px; right: -8px; }
        .specimen-tick.bl { bottom: -8px; left: -8px; }
        .specimen-tick.br { bottom: -8px; right: -8px; }

        .routed-slot {
            background-color: transparent;
            box-shadow: 0 0 0 1px #e3dac9;
        }

        .technical-label {
            font-family: theme('fontFamily.mono');
            color: #b3aa99;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .technical-value {
            font-family: theme('fontFamily.mono');
            color: #e3dac9;
            font-weight: 700;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex items-center justify-center">
<main class="w-full max-w-6xl flex flex-col md:flex-row items-center justify-center p-8 gap-12">
<!-- Sidebar -->
<div class="flex flex-col gap-8 w-full md:w-64">
<div class="border-b border-archive-bone-dim pb-4">
<h2 class="technical-label text-sm mb-1">Specimen ID</h2>
<div class="technical-value text-xl">#ATMC-9042</div>
</div>
<div class="border-b border-archive-bone-dim pb-4">
<h2 class="technical-label text-sm mb-1">Material Data</h2>
<div class="technical-value text-xl">BONE &amp; SLATE</div>
</div>
<div class="border-b border-archive-bone-dim pb-4">
<h2 class="technical-label text-sm mb-1">Archive Date</h2>
<div class="technical-value text-xl">1974.11.23</div>
</div>
</div>
<!-- The Game Board (Archive Edition, specimen-case calibration ticks) -->
<div class="archive-board p-board-padding rounded-sm border-8 border-archive-slate">
<div class="specimen-tick tl"></div>
<div class="specimen-tick tr"></div>
<div class="specimen-tick bl"></div>
<div class="specimen-tick br"></div>
<!-- 10x10 Grid -->
<div class="grid grid-cols-10 gap-0 w-[320px] h-[320px] md:w-[480px] md:h-[480px]">
<!-- Generate 100 slots for visual grid -->
<script>
                for(let i=0; i<100; i++) {
                    document.write('<div class="routed-slot w-full h-full border border-archive-bone"></div>');
                }
            </script>
</div>
</div>
</main>
</body></html>
