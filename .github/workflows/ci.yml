name: CI — Build & Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  contract-tests:
    name: Soroban Contract Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            word-scramble-contract/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('word-scramble-contract/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build contract
        working-directory: word-scramble-contract
        run: cargo build --target wasm32v1-none --release

      - name: Run contract tests
        working-directory: word-scramble-contract
        run: cargo test --verbose

  frontend-check:
    name: Frontend Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify required frontend files exist
        run: |
          echo "Checking required frontend files..."
          for f in \
            index.html style.css script.js stellar.js feedback.js wallet-guide.js \
            daily-words.js wordbank.js themes.css sw.js manifest.json \
            scramble-board.js scramble-board.css scramble-words.js qrcode.js; do
            test -f "$f" && echo "✅ $f" || (echo "❌ $f missing" && exit 1)
          done
          echo "All required files present."

      - name: Build-check frontend JS (syntax validation)
        run: |
          for f in \
            daily-words.js script.js stellar.js feedback.js wallet-guide.js \
            wordbank.js sw.js scramble-board.js scramble-words.js qrcode.js; do
            echo "Checking $f..."
            node --check "$f"
          done

      - name: Cross-check stellar.js calls exist on the contracts
        run: node .github/scripts/check-contract-calls.js
